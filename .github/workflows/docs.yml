name: sphinx

on:
  push:
    branches:
      - master
    paths:
      - docs/**

  workflow_run:
    workflows: ["Release Packages"]
    types:
      - completed

  workflow_dispatch:

env:
  DEFAULT_BRANCH: "master"

jobs:
  build-and-deploy:
    name: Build and gh-pages

    # workflow_run deve essere eseguito solo se Release Packages
    # è terminato correttamente e sulla branch master.
    if: |
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      )

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'master' }}

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # LaTeX / PDF / EPUB
      # ------------------------------------------------------------
      - name: Install LaTeX and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-italian \
            latexmk \
            librsvg2-bin

      # ------------------------------------------------------------
      # Python dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Debug
      # ------------------------------------------------------------
      - name: Debugging information
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo "github.base_ref: ${{ github.base_ref }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "workflow_run.head_branch: ${{ github.event.workflow_run.head_branch }}"
            echo "workflow_run.head_sha: ${{ github.event.workflow_run.head_sha }}"
            echo "workflow_run.conclusion: ${{ github.event.workflow_run.conclusion }}"
          fi

          set -x

          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          git branch
          git branch -a
          git remote -v

          python -V
          pip list --not-required
          pip list

      # ------------------------------------------------------------
      # Build Sphinx
      # ------------------------------------------------------------
      - name: Build Sphinx docs
        run: |
          make html
          make latexpdf
          cp _build/latex/*.pdf _build/html/
          make epub
          cp _build/epub/*.epub _build/html/

      # ------------------------------------------------------------
      # Clone existing gh-pages
      # ------------------------------------------------------------
      - name: Clone old gh-pages
        run: |
          set -x

          git fetch origin gh-pages

          git clone \
            --branch gh-pages \
            --single-branch \
            . \
            _gh-pages/ \
            || mkdir -p _gh-pages

          rm -rf _gh-pages/.git/

      # ------------------------------------------------------------
      # Copy documentation
      #
      # Solo master:
      # la documentazione viene pubblicata nella root di gh-pages.
      # ------------------------------------------------------------
      - name: Copy new build
        run: |
          set -x

          # Elimina la precedente documentazione pubblicata
          # mantenendo eventuali file necessari.
          find _gh-pages/ -mindepth 1 -delete

          # Copia la nuova documentazione HTML
          rsync -a _build/html/ _gh-pages/

      # ------------------------------------------------------------
      # Disable Jekyll
      # ------------------------------------------------------------
      - name: Add .nojekyll
        run: |
          touch _gh-pages/.nojekyll

      # ------------------------------------------------------------
      # Deploy
      # ------------------------------------------------------------
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _gh-pages/
          force_orphan: true
